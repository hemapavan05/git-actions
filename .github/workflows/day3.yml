name: CI-WORK-FLOW

on:
  push:
    branches: ["master", "main", "dev"]

  workflow_dispatch:
    inputs:
      username:
        description: "Enter your username"
        required: true
        default: "Hemapavan"
        type: string

      environment:
        description: "Select deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - production

      deploy:
        description: "Do you want to deploy?"
        required: true
        default: false
        type: boolean


jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check package.json
        run: |
          echo "Checking project files..."
          pwd
          ls -la

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found!"
            echo "npm install cannot run without package.json"
            exit 1
          fi

          echo "package.json found successfully."

      - name: Show Inputs
        run: |
          echo "Username: ${{ inputs.username }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Deploy: ${{ inputs.deploy }}"

      - name: Install Dependencies
        run: npm install


  test:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check package.json
        run: |
          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi

          echo "package.json found."

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test


  security:
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Security Check
        run: |
          echo "Security scan completed successfully."

      - name: Deploy
        if: ${{ inputs.deploy == true }}
        run: |
          echo "Deploying application..."
          echo "Environment: ${{ inputs.environment }}"
          echo "Deployed by: ${{ inputs.username }}"

      - name: Skip Deployment
        if: ${{ inputs.deploy != true }}
        run: |
          echo "Deployment skipped."


  info:
    runs-on: ubuntu-latest

    steps:

      - name: GitHub Information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "User: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
