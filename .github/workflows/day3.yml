name: CI-WORK-FLOW

on:
  push:
    branches: ["master", "main", "dev"]

  workflow_dispatch:
    inputs:
      username:
        description: "Enter your username"
        required: true
        default: "Hemapavan"
        type: string

      environment:
        description: "Select deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - production

      deploy:
        description: "Do you want to deploy?"
        required: true
        default: false
        type: boolean


jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Show Inputs
        run: |
          echo "Username: ${{ inputs.username }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Deploy: ${{ inputs.deploy }}"

      - name: Check Files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build


  test:
    name: Test Application
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  security:
    name: Security and Deployment
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Security Check
        run: |
          echo "Security scan started"
          echo "Security scan completed successfully"

      - name: Deploy
        if: ${{ inputs.deploy == true }}
        run: |
          echo "=============================="
          echo "Deployment Started"
          echo "=============================="
          echo "Username: ${{ inputs.username }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Deployment completed successfully"

      - name: Skip Deployment
        if: ${{ inputs.deploy != true }}
        run: |
          echo "Deployment skipped"

  info:
    name: GitHub Information
    runs-on: ubuntu-latest

    steps:

      - name: Output GitHub Information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
